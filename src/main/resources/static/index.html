<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Explorer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(-45deg,#0f172a,#1e3a8a,#4f46e5,#7c3aed);
            background-size:400% 400%;
            animation:gradient 15s ease infinite;
            color:white;
            padding:30px;
        }

        @keyframes gradient{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .header{ text-align:center; margin-bottom:30px; }
        .header h1{ font-size:3rem; margin-bottom:10px; }
        .header p{ opacity:.8; }

        .search-box{ max-width:600px; margin:20px auto 40px; }

        .search-box input{
            width:100%;
            padding:15px 20px;
            border:none;
            border-radius:20px;
            outline:none;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(10px);
            color:white;
            font-size:16px;
        }

        .search-box input::placeholder{ color:rgba(255,255,255,.7); }

        .stats{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-bottom:30px;
            flex-wrap:wrap;
        }

        .stat{
            background:rgba(255,255,255,.1);
            backdrop-filter:blur(12px);
            padding:15px 25px;
            border-radius:20px;
            text-align:center;
        }

        .stat h2{ font-size:1.6rem; }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:20px;
        }

        .card{
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:20px;
            overflow:hidden;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 20px 40px rgba(0,0,0,.25);
        }

        .flag-box{
            width:100%;
            height:180px;
            background:rgba(0,0,0,.15);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:6rem;
            overflow:hidden;
        }

        .flag{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .content{ padding:18px; }

        .country{ font-size:1.3rem; font-weight:600; margin-bottom:10px; }

        .info{
            display:flex;
            justify-content:space-between;
            gap:12px;
            margin:8px 0;
            font-size:.92rem;
        }

        .info span:last-child{ text-align:right; }

        .label{ opacity:.7; }

        .time{ color:#ffd700; font-weight:600; }

        .empty{
            grid-column:1 / -1;
            text-align:center;
            font-size:1.4rem;
            margin-top:60px;
        }

        @media(max-width:768px){
            body{ padding:16px; }
            .header h1{ font-size:2rem; }
            .grid{ grid-template-columns:1fr; }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🌍 World Explorer</h1>
    <p>Countries • Flags • Local Time • Currency</p>
</div>

<div class="search-box">
    <input type="text" id="search" placeholder="Search country, code, region or currency...">
</div>

<div class="stats">
    <div class="stat">
        <h2 id="countryCount">0</h2>

    </div>
    <div class="stat">
        <h2 id="currencyCount">0</h2>
        <p>Currencies</p>
    </div>
</div>

<div id="countries" class="grid"></div>

    function flagEmoji(code) {
        return code.toUpperCase().replace(/./g,
            ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[ch]);
    }

    function getLocalTime(timezone) {
        try {
            return new Date().toLocaleTimeString("en-US", { timeZone: timezone });
        } catch (e) {
            return "N/A";
        }
    }

    function formatPopulation(n) {
        return n > 0 ? n.toLocaleString("en-US") : "Uninhabited";
    }

    // Flag images come from a free static image CDN (not an API, no key).
    // If an image can't load (e.g. offline), the emoji flag is shown instead.
    function flagHtml(c) {
        const emoji = flagEmoji(c.code);
        const src = `https://flags.restcountries.com/v5/w320/${c.code.toLowerCase()}.png`;
        return `<img class="flag" loading="lazy" src="${src}" alt="Flag of ${escapeHtml(c.name)}"
                     onerror="this.replaceWith(document.createTextNode('${emoji}'))">`;
    }

    function renderCountries(list) {
        const container = document.getElementById("countries");

        if (!list.length) {
            container.innerHTML = `<div class="empty">No countries found</div>`;
            return;
        }

        container.innerHTML = list.map(c => {
            const cur = c.currencies[0];
            const curCode = cur ? cur.code : "None";
            const curName = cur
                ? c.currencies.map(x => x.name).join(", ")
                : "None";
            const zones = c.timezoneCount > 1 ? ` (${c.timezoneCount} zones)` : "";

            return `
            <div class="card">
                <div class="flag-box">${flagHtml(c)}</div>
                <div class="content">
                    <div class="country">${escapeHtml(c.name)}</div>

                    <div class="info">
                        <span class="label">Region</span>
                        <span>${escapeHtml(c.region)}</span>
                    </div>
                    <div class="info">
                        <span class="label">Currency</span>
                        <span>${escapeHtml(c.currencies.map(x => x.code).join(", ") || curCode)}</span>
                    </div>
                    <div class="info">
                        <span class="label">Currency Name</span>
                        <span>${escapeHtml(curName)}</span>
                    </div>
                    <div class="info">
                        <span class="label">Local Time${zones}</span>
                        <span class="time" data-tz="${escapeHtml(c.timezone)}">${getLocalTime(c.timezone)}</span>
                    </div>
                    <div class="info">
                        <span class="label">Population</span>
                        <span>${formatPopulation(c.population)}</span>
                    </div>
                </div>
            </div>`;
        }).join("");
    }

    function updateTimes() {
        document.querySelectorAll(".time[data-tz]").forEach(el => {
            el.textContent = getLocalTime(el.dataset.tz);
        });
    }

    function filterCurrent() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        if (!q) return COUNTRIES;
        return COUNTRIES.filter(c =>
            c.name.toLowerCase().includes(q) ||
            c.code.toLowerCase() === q ||
            c.region.toLowerCase().includes(q) ||
            c.currencies.some(x =>
                x.code.toLowerCase() === q || x.name.toLowerCase().includes(q))
        );
    }

    document.getElementById("countryCount").textContent = COUNTRIES.length;
    document.getElementById("currencyCount").textContent =
        new Set(COUNTRIES.flatMap(c => c.currencies.map(x => x.code))).size;

    document.getElementById("search").addEventListener("input", () => {
        renderCountries(filterCurrent());
    });

    renderCountries(COUNTRIES);
    setInterval(updateTimes, 1000);
</script>
